name: IDA BugFix isolated Node.js tests

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "URL HTTPS d'un dépôt GitHub public"
        required: true
        type: string
      ref:
        description: "Branche ou tag à tester"
        required: true
        default: "main"
        type: string
      run_lint:
        description: "Lancer aussi npm run lint si le script existe"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  isolated-node-tests:
    name: Tests Node.js en conteneur isolé
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Valider les paramètres
        shell: bash
        env:
          REPOSITORY: ${{ inputs.repository }}
          REF_NAME: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [[ ! "$REPOSITORY" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/?$ ]]; then
            echo "::error::Seuls les dépôts GitHub publics au format HTTPS sont acceptés."
            exit 2
          fi
          if [[ ! "$REF_NAME" =~ ^[A-Za-z0-9._/-]{1,100}$ ]] || [[ "$REF_NAME" == -* ]] || [[ "$REF_NAME" == *..* ]]; then
            echo "::error::Nom de branche ou de tag invalide."
            exit 2
          fi

      - name: Télécharger le dépôt public
        shell: bash
        env:
          REPOSITORY: ${{ inputs.repository }}
          REF_NAME: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$REF_NAME" -- "$REPOSITORY" target
          test -f target/package.json || { echo "::error::Ce runner prend actuellement en charge les projets Node.js avec package.json."; exit 3; }
          repo_mb=$(du -sm target | cut -f1)
          if (( repo_mb > 500 )); then echo "::error::Dépôt supérieur à 500 Mo."; exit 5; fi
          if [[ ! -f target/package-lock.json && ! -f target/npm-shrinkwrap.json ]]; then
            echo "::error::Un package-lock.json ou npm-shrinkwrap.json est requis pour une installation reproductible et sûre."
            exit 4
          fi

      - name: Vérifier les URL des paquets verrouillés
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const lockPath = fs.existsSync("target/package-lock.json") ? "target/package-lock.json" : "target/npm-shrinkwrap.json";
          if (fs.statSync(lockPath).size > 10 * 1024 * 1024) throw new Error("Fichier lock dépasse 10 Mo");
          const lock = JSON.parse(fs.readFileSync(lockPath, "utf8"));
          if (Object.keys(lock.packages || {}).length > 2000) throw new Error("Plus de 2 000 entrées de dépendances : limite du runner");
          const urls = [];
          const walk = value => {
            if (!value || typeof value !== "object") return;
            if (typeof value.resolved === "string") urls.push(value.resolved);
            for (const child of Object.values(value)) walk(child);
          };
          walk(lock);
          for (const raw of urls) {
            if (raw.startsWith("file:")) continue;
            let url;
            try { url = new URL(raw); } catch { throw new Error("URL de dépendance invalide dans le lockfile"); }
            if (url.protocol !== "https:" || url.hostname !== "registry.npmjs.org") {
              throw new Error("Dépendance externe bloquée : " + url.hostname);
            }
          }
          console.log("URL de dépendances validées :", urls.length);
          NODE

      - name: Installer les dépendances sans scripts
        shell: bash
        env:
          npm_config_registry: https://registry.npmjs.org
          npm_config_proxy: ""
          npm_config_https_proxy: ""
        run: |
          set -euo pipefail
          npm ci --prefix target --ignore-scripts --no-audit --no-fund

      - name: Précharger le runtime de test
        run: docker pull node:22-alpine

      - name: Exécuter les tests sans réseau
        shell: bash
        env:
          RUN_LINT: ${{ inputs.run_lint }}
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --cpus=1 \
            --memory=1536m \
            --pids-limit=128 \
            --security-opt=no-new-privileges:true \
            --cap-drop=ALL \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m,uid=1000,gid=1000 \
            --tmpfs /work:rw,nosuid,nodev,size=1024m,uid=1000,gid=1000 \
            --mount "type=bind,src=$GITHUB_WORKSPACE/target,dst=/input,readonly" \
            --workdir /work \
            --user 1000:1000 \
            --env HOME=/tmp \
            --env RUN_LINT="$RUN_LINT" \
            node:22-alpine \
            sh -euc '
              for item in /input/.[!.]* /input/*; do [ -e "$item" ] || continue; [ "$(basename "$item")" = ".git" ] && continue; cp -R "$item" /work/; done
              node -e "if (!require(\"./package.json\").scripts?.test) { console.error(\"Aucun script test dans package.json\"); process.exit(3); }"
              echo "=== npm test ==="
              npm test
              if [ "$RUN_LINT" = "true" ]; then
                if node -e "process.exit(require(\"./package.json\").scripts?.lint ? 0 : 1)"; then
                  echo "=== npm run lint ==="
                  npm run lint
                else
                  echo "Aucun script lint : étape ignorée."
                fi
              fi
            '
